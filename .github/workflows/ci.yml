name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # Note: `npm install` 而不是 `npm ci`，因为 esbuild 0.28 有大量 optional 平台包
      # (@esbuild/netbsd-arm64 等) 是 host-cpu-only 装入 lock 的，`npm ci` 会误报
      # "Missing X from lock file"。
      - run: npm install --no-audit --no-fund
        shell: bash
      - run: npm run typecheck
        shell: bash
      - run: npm run test:unit
        shell: bash
      # integration 依赖起真实端口，macOS/Ubuntu 都能跑；Windows 上端口分配有时会撞
      # ClamAV/防火墙，先跳过。
      - if: matrix.os != 'windows-latest'
        run: npm run test:integration
        shell: bash
