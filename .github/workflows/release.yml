# Release workflow
#
# 触发条件（只有明确执行才会发布）：
#   1) push tag `v*`（推荐路径，通常来自 /release slash command → scripts/release.mjs）
#   2) 或 GitHub UI 里 workflow_dispatch 手动跑，输入 version（例：0.2.0）
#
# 三个平台并行打包，产物汇总到同一个 GitHub Release：
#   - macOS  → arm64 + x64 dmg / zip / blockmap
#   - Windows → x64 + arm64 nsis (.exe) / zip
#   - Linux  → x64 + arm64 AppImage / deb
#
# 所有产物都是未签名版本（社区包免费下载）；用户第一次打开需要在系统设置里放行。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v), e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  # 各平台并行构建，产物 upload 到临时 artifact
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            targets: '--mac dmg zip -c.mac.identity=null'
            env: 'CSC_IDENTITY_AUTO_DISCOVERY=false'
          - os: windows-latest
            platform: win
            targets: '--win nsis zip'
            env: ''
          - os: ubuntu-latest
            platform: linux
            targets: '--linux AppImage deb'
            env: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        # 用 npm install 而不是 npm ci —— esbuild 0.28+ 有大量按 CPU 存的 optional
        # 平台包，npm ci 在非 host 平台上报 "Missing X from lock file"。
        run: npm install --no-audit --no-fund
        shell: bash

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm run test:unit
        shell: bash

      - name: Build renderer
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx vite build
        shell: bash

      - name: Build electron app (${{ matrix.platform }})
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ${{ matrix.env }} npx electron-builder ${{ matrix.targets }} --publish never
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxybaby-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 7

  # 汇总所有平台产物 → 创建 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist-artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.blockmap' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name 'latest*.yml' \
          \) -exec cp -v {} release-assets/ \;
          ls -la release-assets

      - name: Extract release notes from CHANGELOG.md
        run: |
          # extract-changelog.mjs never fails; it falls back to "Release vX.Y.Z"
          # if the section isn't found. So we can pipe directly.
          node scripts/extract-changelog.mjs "${{ steps.ver.outputs.version }}" > /tmp/notes.md
          echo "--- release notes ---"
          cat /tmp/notes.md
          echo "--- end ---"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # 如果 tag 是 workflow_dispatch 触发的，需要先创建
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              release-assets/*
          fi
